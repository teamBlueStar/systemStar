kind = "web"
previewPath = "/admin/"
title = "BlueStar Admin"
version = "1.0.0"
id = "artifacts/bluestar-admin"
router = "path"

[[services]]
name = "web"
paths = [ "/admin/" ]
localPort = 21765

[services.development]
run = "pnpm --filter @workspace/bluestar-admin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bluestar-admin", "run", "build" ]
serve = "static"
publicDir = "artifacts/bluestar-admin/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21765"
BASE_PATH = "/admin/"
